<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SchoolHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- SQLite compiled to WebAssembly: the whole database runs in the browser. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <!-- GSAP is optional: without it the app works the same, just without animations. -->
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <!-- Schema + demo data as SQL (generated by db/seed.py). -->
    <script defer src="db/seed.js"></script>
    <!-- Interface text in every language. -->
    <script defer src="i18n.js"></script>
    <script defer src="app.js"></script>
</head>
<body>
    <div id="app" class="app" data-theme="light">
        <div class="layout">
            <aside class="sidebar">
                <div class="brand" data-side>
                    <div class="brand-mark"></div>
                    <span>SchoolHub</span>
                </div>

                <nav class="nav" id="nav">
                    <div class="nav-indicator" id="nav-indicator"></div>
                    <div id="nav-items"></div>
                </nav>

                <!-- Development helper: switch between the admin, teacher and student views. -->
                <div class="dev-panel" id="dev-panel" data-side></div>
            </aside>

            <main class="main" id="main">
                <p class="muted">Loading database…</p> <!-- replaced by the translated text on start -->
            </main>
        </div>

        <div id="drawer-root"></div>
        <div id="modal-root"></div>
        <div id="toast-root" class="toast-wrap"></div>

        <!-- Used by "Open .db file" in the dev panel. -->
        <input type="file" id="db-file" accept=".db,.sqlite,.sqlite3" hidden />
    </div>
</body>
</html>
